<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>I, the Jury Live</title>
<meta name="description" content="A ten-minute simulation of I, the Jury: prediction markets on legal cases, six months of rulings, and thousands of simulated traders.">
<meta name="theme-color" content="#0B1018">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230B1018%22/><text x=%2250%22 y=%2272%22 font-family=%22Georgia,serif%22 font-size=%2270%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23F5B82E%22>I</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div class="app" id="app" data-view="markets">
  <nav class="nav" id="nav" aria-label="Main">
    <div class="brand">
      <span class="logo">I<b>,</b> the Jury</span>
      <span class="live-tag">Live simulation</span>
    </div>
    <button data-go="markets" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Markets</span></button>
    <button data-go="port">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM8 7V5h8v2M3 12h18"/></svg><span>Portfolio</span></button>
    <button data-go="biz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10M9 20v-6h6v6"/></svg><span>Business</span></button>
    <button data-go="stand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20.5h7M10 17h4v3.5h-4z"/></svg><span>Standings</span></button>
    <div class="nav-foot" id="navWallet"></div>
  </nav>

  <div class="main">
    <header class="bar" id="bar"></header>
    <div class="panes">
      <section class="view on" id="v-markets" aria-label="Markets"></section>
      <section class="view" id="v-market" aria-label="Market"></section>
      <section class="view" id="v-port" aria-label="Your portfolio"></section>
      <section class="view" id="v-biz" aria-label="The business"></section>
      <section class="view" id="v-stand" aria-label="Standings"></section>
    </div>
  </div>

  <aside class="moment" id="moment" aria-label="Breaking news"></aside>
  <div class="sr" id="srLive" aria-live="polite"></div>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="scenario.js"></script>
<script src="engine.js"></script>
<script src="sim.js"></script>
</body>
</html>
